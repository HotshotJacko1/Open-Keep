# nginx site for the self-hosted Open Keep web app (see Dockerfile, SELF_HOSTING.md).
# Plain HTTP on 8080: put it behind your own HTTPS reverse proxy, because the app
# needs HTTPS (or localhost) for its encryption to work in the browser.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Built files have a content hash in their name, so they can be cached for good.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Rewritten at every container start: never cache.
    location = /config.js {
        expires -1;
    }

    # The app has one page; every other path loads it.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # /webdav/ forwarding, when OPENKEEP_WEBDAV_UPSTREAM is set (40-open-keep-config.sh).
    include /tmp/open-keep-*.conf;
}
